plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
     id 'com.bmuschko.clover' version '3.0.7'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}
def javafx_platform = "mac" 

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    clover 'org.openclover:clover:4.5.2'
    // This dependency is used by the application.
    implementation libs.guava
    implementation "org.openjfx:javafx-controls:21:${javafx_platform}"
    implementation "org.openjfx:javafx-graphics:21:${javafx_platform}"
    implementation "org.openjfx:javafx-base:21:${javafx_platform}"
    implementation "org.openjfx:javafx-fxml:21:${javafx_platform}"
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'edu.duke.yh475.battleship.Launcher'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

test {
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

clover {
    report {
        html = true
    }
    compiler {
        debug = true
    }
}

run{
    standardInput = System.in
}
